<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Blue Ocean Wellness Spa - 업무 포털</title>
<link rel="icon" type="image/png" href="/spa-guard/logo.png">
<link rel="apple-touch-icon" href="/spa-guard/logo.png">
<script>
  /* 예전 주소(bowspa.kr/?nfc=11, ?report=hr 등)로 들어오면 SpaGuard로 그대로 넘깁니다 */
  (function(){
    var q = new URLSearchParams(location.search);
    var keys = ['nfc','report','dept','inspector','roleName','admin'];
    for (var i = 0; i < keys.length; i++) {
      if (q.has(keys[i])) { location.replace('/spa-guard' + location.search); return; }
    }
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f1f5f9;color:#0f172a;
    font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 32px;
    padding-top:max(16px, env(safe-area-inset-top))}

  header{text-align:center;padding:10px 0 16px}
  header .logo{width:52px;height:52px;border-radius:14px;object-fit:cover;display:block;margin:0 auto 8px;
    box-shadow:0 2px 8px rgba(15,23,42,.08)}
  header h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
  header p{font-size:13px;color:#64748b;margin-top:4px}

  .sec{margin-top:18px}
  .sec h2{font-size:13px;font-weight:700;color:#64748b;margin:0 4px 8px}

  .apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .app{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 14px;
    display:flex;flex-direction:column;gap:6px;min-height:118px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .08s, box-shadow .15s}
  .app:active{transform:scale(.98)}
  .app:hover{box-shadow:0 4px 14px rgba(15,23,42,.08)}
  .app .ic{font-size:28px;line-height:1}
  .app .t{font-size:16px;font-weight:800}
  .app .d{font-size:12px;color:#64748b;line-height:1.4}
  .app.blue{background:#2563eb;border-color:#2563eb;color:#fff}
  .app.blue .d{color:#dbeafe}
  .app.soon{background:transparent;border:1.5px dashed #cbd5e1;box-shadow:none;color:#94a3b8;
    align-items:center;justify-content:center;text-align:center;pointer-events:none}
  .app.soon .t{font-size:14px;font-weight:700}

  .reports{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rp{background:#fff;border:1px solid #e2e8f0;border-radius:12px;height:64px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:13px;font-weight:700;text-align:center;padding:4px}
  .rp:active{background:#eff6ff;border-color:#93c5fd}
  .rp span{font-size:20px;line-height:1}

  footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/spa-guard/logo.png" alt="">
    <h1>Blue Ocean Wellness Spa</h1>
    <p id="today">업무 포털</p>
  </header>

  <section class="sec">
    <h2>업무 앱</h2>
    <div class="apps" id="apps"></div>
  </section>

  <section class="sec">
    <h2>파트별 일일보고</h2>
    <div class="reports" id="reports"></div>
  </section>

  <footer>블루오션 웰니스 스파 · bowspa.kr</footer>
</div>

<script>
  /* ===== 메뉴 목록 =====
     새 기능을 추가할 때는 아래 APPS 배열에 한 줄만 추가하면 됩니다.
     tone: 'blue' 는 강조 카드, soon: true 는 '준비 중' 자리표시 카드 */
  var APPS = [
    { href: '/spa-guard', icon: '🛡️', title: '안전점검표', desc: '부서별 일일 시설·안전 점검 (SpaGuard)', tone: 'blue' },
    { href: '/schedule',  icon: '🗓️', title: '근무 스케줄표', desc: '주간 근무·보조업무 스케줄' },
    { soon: true, icon: '＋', title: '새 기능 준비 중' }
  ];

  var REPORTS = [
    { id: 'general',   icon: '🛠️', label: '시설·현장 총괄' },
    { id: 'hr',        icon: '👥', label: '인사·마케팅' },
    { id: 'reception', icon: '🛎️', label: '리셉션' },
    { id: 'cleaning',  icon: '🧹', label: '미화' },
    { id: 'food',      icon: '🍽️', label: '푸드' },
    { id: 'snack',     icon: '☕', label: '스낵' }
  ];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  document.getElementById('apps').innerHTML = APPS.map(function(a){
    if (a.soon) return '<div class="app soon"><div class="ic">' + esc(a.icon) + '</div><div class="t">' + esc(a.title) + '</div></div>';
    return '<a class="app ' + (a.tone || '') + '" href="' + esc(a.href) + '">' +
      '<div class="ic">' + esc(a.icon) + '</div><div class="t">' + esc(a.title) + '</div>' +
      '<div class="d">' + esc(a.desc || '') + '</div></a>';
  }).join('');

  document.getElementById('reports').innerHTML = REPORTS.map(function(r){
    return '<a class="rp" href="/spa-guard?report=' + r.id + '"><span>' + r.icon + '</span>' + esc(r.label) + '</a>';
  }).join('');

  var d = new Date(), W = ['일','월','화','수','목','금','토'];
  document.getElementById('today').textContent =
    d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + W[d.getDay()] + ') · 업무 포털';
</script>
</body>
</html>
