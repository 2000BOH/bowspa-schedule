<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bowspa Schedule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{font-family:'Apple SD Gothic Neo',system-ui,sans-serif;background:#f0f4f8;color:#1a2332}
body{min-height:100vh;padding:16px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;color:#1e3a5f}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{border:1px solid #c5d3e0;background:white;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;color:#1e3a5f}
.week-nav button:hover{background:#e8eef5}
.week-nav select{border:1px solid #c5d3e0;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;background:white;color:#1e3a5f}
.card{background:white;border-radius:14px;box-shadow:0 2px 12px #0001;overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid #edf1f5;font-size:13px}
th{background:#f5f8fc;color:#4a6a8a;font-weight:700;position:sticky;top:0}
th.day-header{min-width:100px}
td.name{font-weight:700;color:#1e3a5f;background:#fafbfd;white-space:nowrap;position:sticky;left:0;z-index:1}
.shift{display:inline-block;background:#e3effd;color:#1a4b8c;border-radius:6px;padding:3px 8px;margin:2px;font-size:12px;font-weight:600;white-space:nowrap}
.shift.night{background:#fce4ec;color:#8b1a2b}
.shift.early{background:#e8f5e9;color:#2e6b30}
td.off{color:#b0b8c4;font-size:12px}
.sup{font-size:10px;color:#7a8a9e;display:block;margin-top:2px}
.status{text-align:center;padding:40px;color:#7a8a9e}
.legend{display:flex;gap:16px;justify-content:center;padding:12px;font-size:12px;color:#5a6a7a;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .d{background:#e3effd}.legend .n{background:#fce4ec}.legend .e{background:#e8f5e9}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Bowspa Schedule</h1>
<div class="week-nav">
<button id="prev">&lt;</button>
<select id="weekSel"></select>
<button id="next">&gt;</button>
</div>
</header>
<div class="card">
<div id="app"><div class="status">Loading...</div></div>
</div>
<div class="legend">
<span><i class="d"></i> Day</span>
<span><i class="e"></i> Early</span>
<span><i class="n"></i> Night</span>
</div>
</div>
<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const app=document.getElementById('app');
const sel=document.getElementById('weekSel');
let allWeeks=[];

function minutesToTime(m){const h=Math.floor(m/60)%24;const mi=m%60;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function shiftClass(s){if(s>=1020)return'night';if(s<420)return'early';return''}

function getWeekDates(weekStr){
const p=weekStr.split('-').map(Number);
const base=new Date(p[0],p[1]-1,p[2]);
return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return d});
}

function render(data){
if(!data.schedules||data.schedules.length===0){app.innerHTML='<div class="status">No data</div>';return}
const week=data.schedules[0].week;
const dates=getWeekDates(week);
let html='<table><thead><tr><th>Name</th>';
dates.forEach((d,i)=>{html+='<th class="day-header">'+DAYS[d.getDay()]+'<br>'+(d.getMonth()+1)+'/'+d.getDate()+'</th>'});
html+='</tr></thead><tbody>';
data.schedules.forEach(row=>{
const parsed=JSON.parse(row.data);
const work=parsed.work||{};
html+='<tr><td class="name">'+row.person+'</td>';
for(let i=0;i<7;i++){
const shifts=work[String(i)];
if(!shifts||shifts.length===0){html+='<td class="off">OFF</td>';continue}
html+='<td>';
shifts.forEach(sh=>{
const cls=shiftClass(sh.s);
html+='<span class="shift '+(cls||'')+'">'+minutesToTime(sh.s)+' ~ '+minutesToTime(sh.e)+'</span>';
});
html+='</td>';
}
html+='</tr>';
});
html+='</tbody></table>';
app.innerHTML=html;
}

async function load(week){
try{
const url=week?'/api/schedules?week='+encodeURIComponent(week):'/api/schedules';
const res=await fetch(url,{cache:'no-store'});
const data=await res.json();
if(data.weeks&&allWeeks.length===0){
allWeeks=data.weeks;
sel.innerHTML='';
allWeeks.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;sel.appendChild(o)});
}
if(week)sel.value=week;
render(data);
}catch(e){app.innerHTML='<div class="status">Error</div>'}
}

sel.addEventListener('change',()=>load(sel.value));
document.getElementById('prev').addEventListener('click',()=>{const i=allWeeks.indexOf(sel.value);if(i<allWeeks.length-1){sel.value=allWeeks[i+1];load(sel.value)}});
document.getElementById('next').addEventListener('click',()=>{const i=allWeeks.indexOf(sel.value);if(i>0){sel.value=allWeeks[i-1];load(sel.value)}});
load();
</script>
</body>
</html>
