<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bowspa Schedule | 연결 점검</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,620px);background:white;border:1px solid #e1e7f0;border-radius:20px;padding:36px;box-shadow:0 18px 48px #172b4d12}.eyebrow{color:#4567b3;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,38px);margin:10px 0 12px}p{line-height:1.7;color:#526078}.status{display:flex;align-items:center;gap:12px;margin:26px 0;padding:17px 20px;background:#f5f8fc;border-radius:12px;font-weight:700}.dot{width:11px;height:11px;border-radius:50%;background:#a0aabc;flex:none}.ok .dot{background:#21a36a}.error .dot{background:#d35c51}.note{border-top:1px solid #e7ebf1;padding-top:20px;font-size:14px}button{border:0;border-radius:10px;background:#254fa8;color:white;font:inherit;font-weight:700;padding:11px 17px;cursor:pointer}button:hover{background:#1b3d87}a{color:#254fa8}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">Bowspa Schedule</div>
<h1>연결 점검</h1>
<p>GitHub, Vercel, Turso 데이터베이스 연결 상태를 확인하는 시작 화면입니다.</p>
<div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="message">데이터베이스 연결 확인 중...</span></div>
<button type="button" id="retry">다시 확인</button>
<p class="note">일정 조회 및 편집 기능은 아직 구현되지 않았습니다. 이 페이지는 데이터를 표시하거나 변경하지 않습니다. <a href="https://github.com/2000BOH/bowspa-schedule">GitHub 저장소</a></p>
</main>
<script>
async function check(){const box=document.getElementById('status');const message=document.getElementById('message');box.className='status';message.textContent='데이터베이스 연결 확인 중...';try{const response=await fetch('/api/health',{cache:'no-store'});const data=await response.json();if(!response.ok||data.status!=='connected')throw new Error('not connected');box.classList.add('ok');message.textContent='Turso 데이터베이스 연결 정상';}catch{box.classList.add('error');message.textContent='연결 확인 실패. Vercel 환경 변수를 확인하세요.';}}
document.getElementById('retry').addEventListener('click',check);check();
</script>
</body>
</html>
